name: repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc clang binutils \
            zlib1g-dev libssl-dev libsqlite3-dev libxml2-dev libjson-c-dev libpng-dev
      - name: Create offline local environment
        run: python3 scripts/install_local.py .venv
      - name: Run repository checks
        run: .venv/bin/python -B scripts/validate.py --suite quick
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: validation-logs/
          if-no-files-found: warn
